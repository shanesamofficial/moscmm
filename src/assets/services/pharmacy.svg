<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Pharmacy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle pattern -->
  <g opacity="0.22">
    <circle cx="140" cy="130" r="6" fill="#93c5fd"/>
    <circle cx="220" cy="210" r="6" fill="#93c5fd"/>
    <circle cx="310" cy="120" r="6" fill="#93c5fd"/>
    <circle cx="1000" cy="160" r="6" fill="#93c5fd"/>
    <circle cx="1060" cy="250" r="6" fill="#93c5fd"/>
    <circle cx="980" cy="310" r="6" fill="#93c5fd"/>
  </g>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="960" height="560" rx="40" fill="#ffffff"/>
  </g>

  <!-- Left: Pharmacy cross badge -->
  <g transform="translate(220 250)">
    <rect x="0" y="0" width="220" height="220" rx="38" fill="#eff6ff" stroke="#bfdbfe" stroke-width="6"/>
    <g transform="translate(110 110)">
      <rect x="-18" y="-70" width="36" height="140" rx="14" fill="#2563eb"/>
      <rect x="-70" y="-18" width="140" height="36" rx="14" fill="#2563eb"/>
    </g>
  </g>

  <!-- Right: Simplified shelves / bottles -->
  <g transform="translate(520 240)" fill="none" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round">
    <path d="M0 40 H520"/>
    <path d="M0 190 H520"/>
    <path d="M0 340 H520"/>
  </g>

  <g transform="translate(560 275)">
    <g>
      <rect x="0" y="0" width="110" height="160" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="6"/>
      <rect x="18" y="24" width="74" height="56" rx="12" fill="#eff6ff"/>
      <rect x="22" y="100" width="66" height="40" rx="12" fill="#f3f4f6"/>
      <rect x="26" y="-26" width="58" height="36" rx="14" fill="#bfdbfe"/>
    </g>
    <g transform="translate(150 10)">
      <rect x="0" y="0" width="130" height="150" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="6"/>
      <rect x="22" y="22" width="86" height="56" rx="12" fill="#eff6ff"/>
      <rect x="26" y="98" width="78" height="36" rx="12" fill="#f3f4f6"/>
      <rect x="32" y="-26" width="66" height="36" rx="14" fill="#bfdbfe"/>
    </g>
    <g transform="translate(330 20)">
      <rect x="0" y="0" width="150" height="140" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="6"/>
      <rect x="28" y="22" width="94" height="54" rx="12" fill="#eff6ff"/>
      <rect x="32" y="92" width="86" height="32" rx="12" fill="#f3f4f6"/>
      <rect x="42" y="-26" width="66" height="36" rx="14" fill="#bfdbfe"/>
    </g>
  </g>

  <!-- Pill / capsule illustration -->
  <g transform="translate(600 540) rotate(-12)">
    <rect x="-200" y="-70" width="400" height="140" rx="70" fill="#ffffff" stroke="#d1d5db" stroke-width="6"/>
    <path d="M0 -70 A70 70 0 0 1 0 70" fill="url(#pill)"/>
    <path d="M0 -70 V70" stroke="#bfdbfe" stroke-width="8"/>
    <circle cx="120" cy="0" r="10" fill="#e5e7eb"/>
    <circle cx="80" cy="30" r="10" fill="#e5e7eb"/>
    <circle cx="90" cy="-25" r="10" fill="#e5e7eb"/>
  </g>

  <!-- Title text -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#1f2937">
    <text x="220" y="200" font-size="44" font-weight="700">Pharmacy</text>
    <text x="220" y="235" font-size="22" fill="#4b5563">On-site medicines for prescriptions and follow-up care</text>
  </g>
</svg>
